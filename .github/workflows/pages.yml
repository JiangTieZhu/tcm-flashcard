name: Deploy static flashcard to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 使用前需在仓库 Settings → Pages → Source 中选择 “GitHub Actions”
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -r index.html styles.css app.js assets data _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行若 Pages 站点尚未创建，尝试自动创建
          enablement: true
          # 可选：若自动创建失败，在仓库 Secrets 中添加 PAGES_TOKEN（Pages 读写权限）
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
